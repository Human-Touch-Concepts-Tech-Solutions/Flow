services:
  chromadb:
    image: chromadb/chroma:0.5.5
    container_name: chromadb
    ports:
      - "8001:8000" # 🔥 Changed to 8000 so your local Python backend can reach it naturally on localhost:8000
    volumes:
      - ./chroma_db_files:/data
    environment:
      - PERSIST_DIRECTORY=/data
      - ANONYMIZED_TELEMETRY=False
    deploy:
      resources:
        limits:
          memory: 4g

volumes:
  chroma_data:
    driver: local